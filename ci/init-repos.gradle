// GitHub CI 用:依赖仓库整体替换为 mavenCentral + GitHub Packages(itsuka 私有构件)。
// 需要环境变量 GH_PACKAGES_USER / GH_PACKAGES_TOKEN(read:packages PAT)。
settingsEvaluated { settings ->
    settings.dependencyResolutionManagement.repositories.clear()
    settings.dependencyResolutionManagement.repositories.mavenCentral()
    settings.dependencyResolutionManagement.repositories.maven { repo ->
        repo.name = "GitHubPackages"
        repo.url = "https://maven.pkg.github.com/ItsukaKotori/itsuka-spring"
        repo.credentials {
            username = System.getenv("GH_PACKAGES_USER") ?: "ItsukaKotori"
            password = System.getenv("GH_PACKAGES_TOKEN")
        }
    }
}
